      security: [{ cronSecret: [] }]
      responses:
        "200": { description: purged }
        "401": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: guard_session
      description: HMAC-сессия после POST /api/auth/login
    moodleApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Равен MOODLE_API_KEY (≥16 символов)
    moodleBearer:
      type: http
      scheme: bearer
      description: Тот же секрет, что MOODLE_API_KEY
    cronSecret:
      type: apiKey
      in: header
      name: X-Cron-Secret
      description: Равен CLEANUP_CRON_SECRET
    qrSignature:
      type: apiKey
      in: query
      name: sig
      description: HMAC подпись REPORT_ACCESS_SECRET

  parameters:
    documentId:
      in: path
      name: documentId
      required: true
      schema: { type: integer }
    sigPath:
      in: path
      name: sig
      required: true
      schema: { type: string }
    sigQuery:
      in: query
      name: sig
      required: true
      schema: { type: string }
    sigQueryOptional:
      in: query
      name: sig
      schema: { type: string }
    startDate:
      in: query
      name: startDate
      schema: { type: string, format: date }
    endDate:
      in: query
      name: endDate
      schema: { type: string, format: date }
    year:
      in: query
      name: year
      schema: { type: integer }
    status:
      in: query
      name: status
      schema: { type: string }
    category:
      in: query
      name: category
      schema: { type: string }

  schemas:
    Ok:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
    ErrorBody:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        code: { type: string }
    SessionUser:
      type: object
      properties:
        username: { type: string }
        role: { type: string, enum: [student, teacher, admin, superadmin] }
        additionalRoles:
          type: array
          items: { type: string }
        email: { type: string }
        fullName: { type: string }
        institution: { type: string }
        institutionId: { type: string }
        faculty: { type: string }
        group: { type: string }
        idleTimeoutSec: { type: integer }
    AnalysisStatus:
      type: object
      properties:
        success: { type: boolean }
        documentId: { type: integer }
        jobId: { type: integer }
        jobStatus: { type: string }
        documentStatus: { type: string }
        title: { type: string }
        filename: { type: string }
        category: { type: string }
        wordCount: { type: integer }
        localPlagiarismPercent: { type: number }
        originalityPercent: { type: number }
        plagiarismPercent: { type: number }
        plagiarismPercentMl: { type: number }
        aiPercentMl: { type: number }
        processingTimeMs: { type: integer }
        lastError: { type: string, nullable: true }

  responses:
    Ok:
      description: Успех
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Ok" }
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
